rule_files:
  - sli_rules.yml

evaluation_interval: 1m

tests:
  # Failures exist and the ok series was never created (L1 just restarted).
  # The ratio is 1 and the page must fire.
  - interval: 1m
    input_series:
      - series: 'proxy_http_upstream_fail_total{node_id="n1",reason="dial"}'
        values: '0+10x10'
      - series: 'proxy_upstream_fail_total{node_id="n1",reason="dial"}'
        values: '0+10x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProxyHTTPFailureRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: plain HTTP failure rate above 2%
      - eval_time: 5m
        alertname: ProxyConnectFailureRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: CONNECT failure rate above 2%
      - eval_time: 5m
        alertname: ProxyCombinedFailureRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: combined failure rate above 2%
    promql_expr_test:
      - eval_time: 5m
        expr: histogram_quantile(0.95, sum by (le) (rate(proxy_http_tunnel_setup_ms_bucket{result="ok"}[5m])))
        exp_samples: []

  # No series at all. Every sum is replaced by 0, the denominator guard holds, nothing pages.
  - interval: 1m
    alert_rule_test:
      - eval_time: 5m
        alertname: ProxyHTTPFailureRate
        exp_alerts: []
      - eval_time: 5m
        alertname: ProxyConnectFailureRate
        exp_alerts: []
      - eval_time: 5m
        alertname: ProxyCombinedFailureRate
        exp_alerts: []
      - eval_time: 5m
        alertname: ProxyHTTPTunnelSetupP95
        exp_alerts: []
      - eval_time: 5m
        alertname: ProxyConnectLatencyP95
        exp_alerts: []

  # HTTP has never failed, so that counter series does not exist.
  # CONNECT is half failures. The combined numerator must still be a number.
  - interval: 1m
    input_series:
      - series: 'proxy_upstream_fail_total{node_id="n1",reason="l2_response"}'
        values: '0+10x10'
      - series: 'proxy_connect_latency_ms_count{node_id="n1",result="ok"}'
        values: '0+10x10'
      - series: 'proxy_http_request_latency_ms_count{node_id="n1",result="ok"}'
        values: '0+100x10'
    promql_expr_test:
      - eval_time: 5m
        expr: (sum(increase(proxy_upstream_fail_total[5m])) or vector(0)) + (sum(increase(proxy_http_upstream_fail_total[5m])) or vector(0))
        exp_samples:
          - labels: '{}'
            value: 50
    alert_rule_test:
      - eval_time: 5m
        alertname: ProxyCombinedFailureRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: combined failure rate above 2%
      - eval_time: 5m
        alertname: ProxyHTTPFailureRate
        exp_alerts: []

  # Counters exist but did not move. 0/0 must not page.
  - interval: 1m
    input_series:
      - series: 'proxy_upstream_fail_total{node_id="n1",reason="dial"}'
        values: '0+0x10'
      - series: 'proxy_connect_latency_ms_count{node_id="n1",result="ok"}'
        values: '0+0x10'
      - series: 'proxy_http_upstream_fail_total{node_id="n1",reason="dial"}'
        values: '0+0x10'
      - series: 'proxy_http_request_latency_ms_count{node_id="n1",result="ok"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProxyConnectFailureRate
        exp_alerts: []
      - eval_time: 5m
        alertname: ProxyHTTPFailureRate
        exp_alerts: []
      - eval_time: 5m
        alertname: ProxyCombinedFailureRate
        exp_alerts: []
